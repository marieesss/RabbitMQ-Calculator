<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculatrice Distribuée</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
      color: #333;
    }

    form {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    input[type="number"], select {
      flex: 1;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    select {
      max-width: 140px;
    }

    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background: #3498db;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    #history {
      list-style: none;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
    }

    #history li {
      padding: 0.4rem;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calculatrice</h1>

    <form id="calc-form">
      <input type="number" id="n1" placeholder="Nombre 1" required>
      <select id="operation" required>
        <option value="add">+</option>
        <option value="sub">-</option>
        <option value="div">/</option>
        <option value="mul">*</option>
        <option value="all">Toutes</option>
      </select>
      <input type="number" id="n2" placeholder="Nombre 2" required>
      <button type="submit">Envoyer</button>
    </form>

    <h2>Historique</h2>
    <ul id="history"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
